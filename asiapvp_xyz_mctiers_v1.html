const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=ms=>{const s=Math.floor((Date.now()-ms)/1000);return s<60?s+"s ago":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"};
const dago=d=>d?d+"d ago":"today";
const sign=d=>`<span class="${d>=0?"up":"down"}">${d>=0?"+":""}${d}</span>`;
const wr=r=>Math.round(r.w/(r.w+r.l)*100)+"%";
function head(uuid,size=28){let h=0;for(const c of uuid)h=(h*31+c.charCodeAt(0))>>>0;
  const hue=h%360,skin=`hsl(${(h>>3)%40+15} 45% ${45+(h>>5)%25}%)`,hair=`hsl(${hue} 40% 28%)`,eye=`hsl(${(hue+180)%360} 60% 40%)`;
  let r="";const px=(x,y,c)=>r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
  for(let y=0;y<8;y++)for(let x=0;x<8;x++)px(x,y,y<2?hair:skin);
  [0,1,6,7].forEach(x=>px(x,2,(h>>x)&1?hair:skin));px(2,4,eye);px(5,4,eye);for(let x=2;x<6;x++)px(x,6,(h>>9)&1?"#7a4a3a":skin);
  return`<svg class="head" width="${size}" height="${size}" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
function toast(msg,err){const el=document.createElement("div");el.className="toast"+(err?" err":"");el.textContent=msg;$("#toasts").appendChild(el);setTimeout(()=>el.remove(),3800)}
const DN=(()=>{try{return new Intl.DisplayNames(["en"],{type:"region"})}catch(e){return null}})();
const cname=c=>{try{return(DN&&DN.of(c))||c}catch(e){return c}};
const cemoji=c=>String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0)));
/* flag image from flagcdn; falls back to the emoji flag if the image cannot load */
const flag=(c,h=15)=>`<img class="flag" style="height:${h}px" src="https://flagcdn.com/w${h>18?80:40}/${c.toLowerCase()}.png" alt="${esc(cname(c))}" title="${esc(cname(c))}" loading="lazy" onerror="this.outerHTML='<span class=&quot;fe&quot; title=&quot;${c}&quot;>${cemoji(c)}</span>'">`;
const regPill=c=>`<span class="cty" title="${esc(cname(c))}">${flag(c)}${c}</span>`;
const rk=r=>`<span class="rk${r<=3?" r"+r:""}">${r}</span>`;
const title=e=>e>=2300?"Apex Duelist":e>=1900?"Veteran":e>=1500?"Contender":"Rookie";
const lbRow=(r,i)=>`<a href="#/player/${r.uuid}" class="lbrow">${rk(i)}<span class="who">${av(r.uuid,40)}<span style="min-width:0"><b>${P(r.uuid).name}</b><small>${title(r.elo)}</small></span></span>${regPill(P(r.uuid).country)}<span class="hm sm mute">${r.w}W ${r.l}L</span><span class="hm sm mute">${wr(r)}</span><span class="eloB">${r.elo}</span></a>`;
function figure(uuid){let h=0;for(const c of uuid)h=(h*31+c.charCodeAt(0))>>>0;
  const hue=h%360,skin=`hsl(${(h>>3)%40+15} 45% ${45+(h>>5)%25}%)`,hair=`hsl(${hue} 40% 28%)`,eye=`hsl(${(hue+180)%360} 60% 40%)`,shirt=`hsl(${(hue+90)%360} 55% 42%)`,pants=`hsl(${(hue+200)%360} 35% 26%)`;
  let r="";const px=(x,y,c,w=1,t=1)=>r+=`<rect x="${x}" y="${y}" width="${w}" height="${t}" fill="${c}"/>`;
  for(let y=0;y<8;y++)for(let x=0;x<8;x++)px(4+x,y,y<2?hair:skin);
  [0,1,6,7].forEach(x=>px(4+x,2,(h>>x)&1?hair:skin));px(6,4,eye);px(9,4,eye);for(let x=2;x<6;x++)px(4+x,6,(h>>9)&1?"#7a4a3a":skin);
  px(4,8,shirt,8,12);px(0,8,shirt,4,4);px(0,12,skin,4,8);px(12,8,shirt,4,4);px(12,12,skin,4,8);px(4,20,pants,4,12);px(8,20,pants,4,12);
  return`<svg viewBox="0 0 16 32" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const CR="https://render.crafty.gg/3d/";
/* skin renders now come from mc-heads.net (see SK below) */
/* real skins from mc-heads.net (isometric 3D head and body, accepts a username or UUID); crafthead.net is the backup, then the generated pixel art */
/* SKIN_DATA is filled by embed_skins.py with base64 skin images so the page works even where outside images are blocked */
const SKIN_DATA={};
const SK={bust:n=>[...(SKIN_DATA["bust:"+decodeURIComponent(n)]?[SKIN_DATA["bust:"+decodeURIComponent(n)]]:[]),`https://mc-heads.net/head/${n}/224`,`https://crafthead.net/bust/${n}/224`],full:n=>[...(SKIN_DATA["full:"+decodeURIComponent(n)]?[SKIN_DATA["full:"+decodeURIComponent(n)]]:[]),`https://mc-heads.net/body/${n}/272`,`https://crafthead.net/body/${n}/272`]};
window.skinFail=img=>{const l=JSON.parse(img.dataset.l),i=+img.dataset.i+1;if(i<l.length){img.dataset.i=i;img.src=l[i];return}
  console.warn("skin failed to load:",l);const k=img.dataset.k,u=img.dataset.u;if(k&&window[k])img.outerHTML=window[k](u,+img.dataset.h||32);else img.remove()};
const skinImg=(name,kind,cls,style,k,u,h)=>{const l=SK[kind](encodeURIComponent(name));return`<img class="${cls}" style="${style}" src="${esc(l[0])}" data-l="${esc(JSON.stringify(l))}" data-i="0" ${k?`data-k="${k}" data-u="${u}" data-h="${h||""}"`:""} alt="" referrerpolicy="no-referrer" decoding="async" onerror="skinFail(this)">`};
const full=u=>skinImg(P(u).name,"full","fig","","figure",u);
const av=(u,h=32)=>skinImg(P(u).name,"bust","av",`height:${Math.round(h*1.25)}px`,"head",u,h);
const laurel=cls=>{let g="";const R=Math.PI/180;for(let t=100;t<=260;t+=20){const x=100+80*Math.cos(t*R),y=100+80*Math.sin(t*R),f=t+90;
  for(const d of[-1,1]){const cx=(x+d*7*Math.cos((f+90)*R)).toFixed(1),cy=(y+d*7*Math.sin((f+90)*R)).toFixed(1);g+=`<ellipse cx="${cx}" cy="${cy}" rx="14" ry="5" transform="rotate(${f+d*38} ${cx} ${cy})"/>`}}
  return`<svg class="lau${cls}" viewBox="0 0 110 200" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8a6a12"/><stop offset="1" stop-color="#ffd24a"/></linearGradient></defs><path d="M86.1 178.8A80 80 0 0 1 86.1 21.2" fill="none" stroke="#c99a1e" stroke-width="2"/><g fill="url(#lg)">${g}</g></svg>`};
const pcard=(r,k,d)=>`<a href="#/player/${r.uuid}" class="pc p${k}" style="animation:pop .55s ease-out ${d}ms backwards"><span class="nm">${esc(P(r.uuid).name)}</span><span class="sb">${flag(P(r.uuid).country,12)}<span><b>${r.elo}</b> ELO</span></span><span class="fw">${full(r.uuid)}</span><span class="ped">${k}</span></a>`;
const hRow=(r,i)=>`<a href="#/player/${r.uuid}" class="hrow"><span class="n">${i}</span>${av(r.uuid,32)}<span class="nm">${esc(P(r.uuid).name)}</span><span class="rt">${flag(P(r.uuid).country,13)}<span><b>${r.elo}</b> ELO</span></span></a>`;
const cur=()=>rows.filter(r=>r.season==="s2").sort((a,b)=>b.elo-a.elo);
const demoNote=`<div class="demo">Interactive preview with seeded placeholder data. The real build reads ratings from your plugin; nothing here is saved.</div>`;

/* ---------- views ---------- */
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>',crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z" fill="currentColor"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',doc:'<path d="M6 3h9l4 4v14H6zM14 3v5h5"/>',user:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'};
const ic=(k,z=15)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const NAV=[["#/","Home","home"],["#/rankings","Rankings","crown"],["#/countries","Countries","globe"]];
function chrome(path){
  const on=h=>path===h.slice(1)||(h!=="#/"&&path.startsWith(h.slice(1)));
  $("#nav").innerHTML=NAV.map(([h,l,i])=>`<a href="${h}" class="${on(h)?"on":""}">${ic(i)}${l}</a>`).join("");
  $("#nav2").innerHTML=`<a href="#/docs" class="${on("#/docs")?"on":""}">${ic("doc")}Plugin docs</a><a href="#" class="cta">${ic("user")}Join Discord</a>`;
}
function home(){
  const all=cur(),top=all.slice(0,10);
  const avg=Math.round(all.reduce((a,r)=>a+r.elo,0)/all.length);
  const order=[[top[1],2,0],[top[0],1,110],[top[2],3,220]];
  const recent=[...all].sort((a,b)=>a.days-b.days).slice(0,6);
  return`<form id="homesearch" class="hsearch" role="search">${ic("search",16)}<label for="hq" style="position:absolute;left:-9999px">Search players</label><input id="hq" placeholder="Search..." autocomplete="off"></form>
  <section class="stage"><h1 class="tp">Top Players</h1>
   <div class="pod">${laurel("")}${order.map(([r,k,d])=>pcard(r,k,d)).join("")}${laurel(" r")}</div>
   <div class="sep"></div>
   <div class="hrows">${top.slice(3).map((r,i)=>hRow(r,i+4)).join("")}</div>
   <a class="fl" href="#/rankings">Full Leaderboard ▸</a></section>
  <div style="height:32px"></div>
  <div class="grid g2" style="margin-bottom:32px;align-items:start">
   <section><h2>Latest matches</h2><div class="panel list sm">${recent.map(r=>{const m=r.opps[0];return`<a href="#/player/${r.uuid}" class="row">${av(r.uuid,20)}<span style="color:#fff">${P(r.uuid).name}</span><span class="mute">${m&&m.win?"beat":"lost to"} ${m?P(m.opp).name:"–"}</span><span style="margin-left:auto">${sign(r.delta)}</span></a>`}).join("")}</div></section>
   <section><h2>At a glance</h2><div class="grid g2">${[["Players",players.length],["Ranked matches",totalMatches],["Average ELO",avg],["Top ELO",top[0].elo]].map(([k,v])=>`<div class="panel stat" style="padding:16px"><b>${v}</b><span class="mute sm">${k}</span></div>`).join("")}</div></section>
  </div>
  <section class="panel row" style="padding:20px;flex-wrap:wrap"><span style="margin-right:auto">New here? Join the server and play ranked to get on the board.</span><a class="btn" href="#/docs">Plugin docs</a><a class="btn" href="#">Join the community</a></section>${demoNote}`;
}
const PAGE=15;
function rankingsView(q){
  const season=q.get("season")||"s2";
  let list=rows.filter(r=>r.season===season);
  const f={q:(q.get("q")||"").trim().toLowerCase(),country:(q.get("country")||"").toUpperCase()};
  if(f.q)list=list.filter(r=>P(r.uuid).name.toLowerCase().includes(f.q)||r.uuid.startsWith(f.q));
  if(f.country)list=list.filter(r=>P(r.uuid).country===f.country);
  list=[...list].sort((a,b)=>b.elo-a.elo||b.w-a.w);
  const page=Math.max(1,+q.get("page")||1),pages=Math.max(1,Math.ceil(list.length/PAGE)),slice=list.slice((page-1)*PAGE,page*PAGE);
  const link=o=>{const u=new URLSearchParams(q);Object.entries(o).forEach(([a,b])=>b?u.set(a,b):u.delete(a));return"#/rankings?"+u};
  const sel=(id,label,opts,val)=>`<div><label class="l" for="f-${id}">${label}</label><select id="f-${id}" data-f="${id}"><option value="">All</option>${opts.map(([v,l])=>`<option value="${v}" ${val===v?"selected":""}>${l}</option>`).join("")}</select></div>`;
  return`<h1 style="font-size:32px;margin-bottom:16px">Rankings</h1>
  <form class="panel grid" style="padding:14px;grid-template-columns:2fr 1fr;align-items:end" id="filters" role="search">
   <div><label class="l" for="f-q">Search</label><input id="f-q" data-f="q" class="inp" value="${esc(q.get("q")||"")}" placeholder="Username or UUID"></div>
   ${sel("country","Country",[...CODES].sort((a,b)=>cname(a).localeCompare(cname(b))).map(c=>[c,cname(c)]),f.country)}
  </form><style>@media(max-width:560px){#filters{grid-template-columns:1fr!important}}</style>
  ${/^[A-Za-z0-9_]{1,16}$/.test((q.get("q")||"").trim())?(()=>{const nm=(q.get("q")||"").trim(),hit=players.find(x=>x.name.toLowerCase()===nm.toLowerCase());return`<a class="panel row" style="gap:14px;padding:12px 16px;margin-top:12px" href="${hit?"#/player/"+hit.uuid:"#/player/@"+encodeURIComponent(nm)}">${skinImg(nm,"bust","av","height:90px")}<span><b style="color:#fff;font-size:17px">${esc(hit?hit.name:nm)}</b><br><span class="mute sm">${hit?"Ranked player":"Not ranked yet"} · click to view stats</span></span></a>`})():""}
  <p class="mute sm" style="margin:12px 0 6px">${list.length} players, ranked from highest to lowest ELO</p>
  <div class="lbh"><span>#</span><span>Player</span><span>Country</span><span class="hm">Record</span><span class="hm">Win rate</span><span style="justify-self:end">ELO</span></div>
  ${slice.length?slice.map((r,i)=>lbRow(r,(page-1)*PAGE+i+1)).join(""):`<div class="panel mute" style="padding:18px">No players match these filters. Clear a filter to see more.</div>`}
  ${pages>1?`<nav class="row" style="justify-content:space-between;margin-top:14px" aria-label="Pagination">${page>1?`<a class="btn" href="${link({page:page-1})}">Previous</a>`:"<span></span>"}<span class="mute sm">Page ${page} of ${pages}</span>${page<pages?`<a class="btn" href="${link({page:page+1})}">Next</a>`:"<span></span>"}</nav>`:""}`;
}
function chart(pts){
  const W=620,H=160,p=10,lo=Math.min(...pts)-10,hi=Math.max(...pts)+10;
  const x=i=>p+i/(pts.length-1)*(W-2*p),y=v=>H-p-(v-lo)/((hi-lo)||1)*(H-2*p);
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="ELO over time"><path d="${pts.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}" fill="none" stroke="#e5232f" stroke-width="2" stroke-linejoin="round"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#070707" stroke="#e5232f" stroke-width="2"><title>${v} ELO</title></circle>`).join("")}</svg>`;
}
function playerView(u){
  if(u[0]==="@"){const nm=decodeURIComponent(u.slice(1)),hit=players.find(x=>x.name.toLowerCase()===nm.toLowerCase());if(hit)return playerView(hit.uuid);
    if(!/^[A-Za-z0-9_]{1,16}$/.test(nm))return`<p>Player not found. <a href="#/rankings" class="u" style="color:var(--em)">Back to rankings</a></p>`;
    return`<header class="row" style="gap:16px;margin-bottom:20px">${skinImg(nm,"bust","av","height:90px")}<div><h1 style="font-size:30px">${esc(nm)}</h1><div class="mute sm">Real skin via mc-heads.net</div></div></header><div class="panel mute" style="padding:18px">${esc(nm)} has no ranked games yet. ELO and match history will appear after their first ranked match.</div>`}
  const p=players.find(x=>x.uuid===u),r=rows.find(x=>x.uuid===u&&x.season==="s2");
  if(!p)return`<p>Player not found. <a href="#/rankings" class="u" style="color:var(--em)">Back to rankings</a></p>`;
  if(!r)return`<h1>${p.name}</h1><p class="mute">No ranked games yet.</p>`;
  const past=rows.filter(x=>x.uuid===u&&x.season==="s1")[0];
  return`<header class="row" style="gap:16px;margin-bottom:28px">${av(u,72)}<div><h1 style="font-size:30px">${p.name}</h1><div class="mono mute" style="word-break:break-all">${u}</div><div class="mute sm">${flag(p.country,15)} ${esc(cname(p.country))} · last match ${dago(r.days)}</div></div></header>
  <section class="grid g4" style="margin-bottom:28px">${[["ELO",`<span class="elo" style="font-size:26px">${r.elo}</span>`],["Overall rank","#"+r.rank+" of "+cur().length],["Record",r.w+"W "+r.l+"L ("+wr(r)+")"],["Peak ELO",r.peak]].map(([k,v])=>`<div class="panel" style="padding:16px"><div class="mute sm">${k}</div><div style="font:700 22px 'Chakra Petch';color:#fff;margin-top:2px">${v}</div></div>`).join("")}</section>
  <div class="grid g2" style="margin-bottom:28px;align-items:start">
   <section><h2>ELO history</h2><div class="panel" style="padding:14px">${chart(r.hist)}</div></section>
   <section><h2>Match history <span class="mute sm" style="font-weight:400">(last ${Math.min(10,r.opps.length)} games)</span></h2><div class="panel list sm">${r.opps.slice(0,10).map(m=>`<a href="#/player/${m.opp}" class="row">${av(m.opp,20)}<span class="${m.win?"up":"down"}" style="width:34px">${m.win?"Win":"Loss"}</span><span style="color:#fff">vs ${P(m.opp).name}</span><span class="mute" style="margin-left:auto">${dago(m.days)}</span><span style="width:34px;text-align:right">${sign(m.d)}</span></a>`).join("")}</div></section>
  </div>`;
}
const docsView=()=>{const r=[["GET","/api/plugin/health","Plugin version, server name, sync status"],["GET","/api/plugin/players","Players (search, page, since)"],["GET","/api/plugin/players/:uuid","Profile, ELO, recent matches"],["GET","/api/plugin/rankings","Overall ELO rankings (country, page, since)"],["GET","/api/plugin/history","ELO history for charts"],["POST","/api/plugin/elo/update","Admin-only ELO adjustment"],["POST","/api/plugin/auth/verify","Exchange one-time code for identity and role"],["GET","/api/plugin/capabilities","{ writes: boolean }"]];
 return`<div style="max-width:780px"><h1 style="font-size:32px;margin-bottom:8px">Plugin API</h1><p class="mute">The asiapvp.xyz plugin owns every rating. Webhooks (<span class="mono">match.completed</span>, <span class="mono">player.rating_changed</span>, <span class="mono">season.started</span>) are signed with HMAC-SHA256 and carry an idempotency key.</p><div class="panel list sm">${r.map(([m,p,d])=>`<div class="row"><span class="mono" style="width:44px;color:var(--em)">${m}</span><span class="mono">${p}</span><span class="mute" style="margin-left:auto;text-align:right">${d}</span></div>`).join("")}</div></div>`};

function countriesView(){
  const cnt={};players.forEach(p=>cnt[p.country]=(cnt[p.country]||0)+1);
  const list=CODES.map(c=>[c,cname(c),cnt[c]||0]).sort((a,b)=>b[2]-a[2]||a[1].localeCompare(b[1]));
  return`<h1 style="font-size:32px;margin-bottom:8px">Countries</h1><p class="mute sm" style="margin:0 0 14px">${CODES.length} flags. ${Object.keys(cnt).length} countries have ranked players. Pick one to see its rankings.</p>
  <label class="l" for="cq" style="position:absolute;left:-9999px">Search countries</label><input id="cq" class="inp" style="max-width:360px" placeholder="Search a country or code">
  <div class="cgrid">${list.map(([c,n,k])=>`<a class="ccard${k?"":" empty"}" href="#/rankings?country=${c}" data-n="${esc((n+" "+c).toLowerCase())}">${flag(c,24)}<span><b>${esc(n)}</b><small>${k?k+" player"+(k>1?"s":""):"No players yet"}</small></span></a>`).join("")}</div>`;
}

/* ---------- router + events ---------- */
let H=location.hash;
function go(h){H=h;try{history.pushState(null,"",h)}catch(e){}route()}
function route(){
  const raw=H.slice(1)||"/";const [path,qs]=raw.split("?");const q=new URLSearchParams(qs||"");const seg=path.split("/").filter(Boolean);
  chrome(path);
  const v={"":home,rankings:()=>rankingsView(q),countries:countriesView,player:()=>playerView(seg[1]),docs:docsView}[seg[0]||""];
  $("#app").innerHTML=v?v():"<p>Page not found.</p>";window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{H=location.hash;route()});window.addEventListener("popstate",()=>{H=location.hash;route()});
document.addEventListener("click",e=>{
  const an=e.target.closest('a[href^="#"]');if(an){e.preventDefault();const hr=an.getAttribute("href");if(hr.length>1)go(hr);return}
  const tr=e.target.closest("tr[data-go]");if(tr&&!e.target.closest("a")){go(tr.dataset.go);return}
});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="homesearch"){go("#/rankings?q="+encodeURIComponent($("#hq").value));return}
});
document.addEventListener("change",e=>{const f=e.target.closest("[data-f]");if(!f)return;
  const q=new URLSearchParams((H.split("?")[1])||"");document.querySelectorAll("[data-f]").forEach(el=>el.value?q.set(el.dataset.f,el.value):q.delete(el.dataset.f));q.delete("page");go("#/rankings?"+q)});
document.addEventListener("input",e=>{if(e.target.id==="cq"){const t=e.target.value.trim().toLowerCase();document.querySelectorAll(".ccard").forEach(a=>a.hidden=!!t&&!a.dataset.n.includes(t))}});
let typing;document.addEventListener("input",e=>{if(e.target.id==="f-q"){clearTimeout(typing);typing=setTimeout(()=>{const q=new URLSearchParams((H.split("?")[1])||"");e.target.value?q.set("q",e.target.value):q.delete("q");q.delete("page");go("#/rankings?"+q);setTimeout(()=>{const i=$("#f-q");i.focus();i.setSelectionRange(i.value.length,i.value.length)},0)},350)}});
route();
</script>
